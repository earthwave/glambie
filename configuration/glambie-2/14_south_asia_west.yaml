# config yaml file for south_asia_west
---
region_name: south_asia_west
year_type: glaciological # glaciological or calendar

seasonal_correction_dataset:
  user_group: ETHZ extended
  data_group: combined

region_run_settings:
  altimetry:
    exclude_annual_datasets :
    - Ke CQ et al from NJU
    - Treichler et al.
    - Menounos et al
    include_combined_annual_datasets:
    - Gardner et al
    include_combined_trend_datasets:
    - 
  gravimetry:
    exclude_annual_datasets :
    - Jacob-et-al_grav
    #- Harig et al.
    #- Ciraci et al.
    #- Sasgen_AWIarc_RL02.1
    #- Gardner et al
    #- Romero_et_al
    #- Wouters
    exclude_trend_datasets :
    -
    #- Wouters
    #- Ciraci et al.
    #- Sasgen_AWIarc_RL02.1
    #- Harig et al.
    #- Romero_et_al
    #- Gardner et al
    include_combined_trend_datasets:
    - 
  demdiff_and_glaciological :
    exclude_annual_datasets : # glaciological datasets
    - 
    exclude_trend_datasets : # demdiff datasets
    - 
    include_combined_annual_datasets:
    - WGMS-DUS_combined
    - ETHZ
    include_combined_trend_datasets:
    - WGMS-DUS_combined
    - ETHZ
    - Gardner et al